<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Pay - Account Work</title>

<link rel="stylesheet" href="accountwork.css">

</head>

<body>

<!-- Background Animation -->

<div class="bgAnimation"></div>

<!-- ================= HEADER ================= -->

<header class="topHeader">

<div class="logoBox">

<h1>GLOBAL PAY</h1>

<p>Professional Banking Statement</p>

</div>

<button id="activeBtn" class="activeBtn">

🟢 ACTIVE

</button>

</header>

<!-- ================= ACCOUNT CARD ================= -->

<section class="accountCard">

<div class="accountLeft">

<h2 id="holderName">

Loading...

</h2>

<p id="bankName">

Loading Bank...

</p>

<p id="accountNumber">

XXXX XXXX XXXX

</p>

<p id="ifscCode">

IFSC CODE

</p>

</div>

<div class="accountRight">

<div class="bankLogo">

🏦

</div>

</div>

</section>

<!-- ================= SUMMARY ================= -->

<section class="summaryGrid">

<div class="summaryCard">

<p>Gaming Fund</p>

<h2 id="gamingFund">

₹0

</h2>

</div>

<div class="summaryCard">

<p>Commission (5%)</p>

<h2 id="commission">

₹0

</h2>

</div>

<div class="summaryCard">

<p>Total Credit</p>

<h2 id="totalCredit">

₹0

</h2>

</div>

<div class="summaryCard">

<p>Total Debit</p>

<h2 id="totalDebit">

₹0

</h2>

</div>

</section>
