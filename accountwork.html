<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Pay - Account Work</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:
radial-gradient(circle at top,#1b4cff,#081120 35%,#050816 100%);

color:#fff;

overflow-x:hidden;

min-height:100vh;

}

.header{

padding:22px;

text-align:center;

font-size:26px;

font-weight:bold;

background:rgba(255,255,255,.05);

backdrop-filter:blur(18px);

border-bottom:1px solid rgba(255,255,255,.08);

}

.container{

width:95%;

max-width:430px;

margin:auto;

padding:20px;

}

.activeCard{

background:linear-gradient(135deg,#1d4ed8,#7c3aed);

border-radius:25px;

padding:25px;

box-shadow:0 15px 45px rgba(37,99,235,.35);

margin-bottom:20px;

position:relative;

overflow:hidden;

}

.activeCard::before{

content:"";

position:absolute;

width:220px;

height:220px;

background:rgba(255,255,255,.08);

border-radius:50%;

top:-90px;

right:-90px;

}

.status{

display:inline-block;

padding:8px 18px;

border-radius:40px;

background:#16a34a;

font-weight:bold;

margin-bottom:20px;

}

.bankItem{

margin-top:14px;

padding:14px;

border-radius:16px;

background:rgba(255,255,255,.08);

display:flex;

justify-content:space-between;

align-items:center;

}

.label{

color:#cbd5e1;

}

.value{

font-weight:bold;

color:#fff;

}

</style>
</head>

<body>

<div class="header">
🏦 GLOBAL PAY
</div>

<div class="container">

<div class="activeCard">

<div class="status">
🟢 ACCOUNT ACTIVE
</div>

<div class="bankItem">
<span class="label">Bank</span>
<span class="value" id="bankName">Loading...</span>
</div>

<div class="bankItem">
<span class="label">Holder</span>
<span class="value" id="holderName">Loading...</span>
</div>

<div class="bankItem">
<span class="label">Account</span>
<span class="value" id="accountNo">Loading...</span>
</div>

<div class="bankItem">
<span class="label">IFSC</span>
<span class="value" id="ifscCode">Loading...</span>
</div>

</div>
<!-- Gaming Fund -->

<div class="activeCard">

<h2 style="margin-bottom:18px;">🎮 Gaming Fund</h2>

<div style="font-size:40px;font-weight:bold;color:#00ff88;" id="gamingFund">
₹ 0
</div>

<div style="margin-top:10px;color:#cbd5e1;">
Live Balance
</div>

</div>

<!-- Commission -->

<div class="activeCard">

<h2 style="margin-bottom:18px;">💎 Commission</h2>

<div style="font-size:34px;font-weight:bold;color:#FFD700;">
5%
</div>

<div style="margin-top:10px;color:#cbd5e1;">
Gaming Commission
</div>

</div>

<div class="activeCard">

<h2 style="margin-bottom:18px;">📈 Recent Credits</h2>

<div id="recentCredits"></div>

</div>
  
<script>

// Bank Details

const bankName=localStorage.getItem("bankName")||"Not Linked";
const holderName=localStorage.getItem("holderName")||"Not Linked";
const account=localStorage.getItem("accountNumber")||"";
const ifsc=localStorage.getItem("ifsc")||"Not Linked";

document.getElementById("bankName").innerText=bankName;
document.getElementById("holderName").innerText=holderName;
document.getElementById("ifscCode").innerText=ifsc;

if(account.length>=4){

document.getElementById("accountNo").innerText=
"XXXX XXXX "+account.slice(-4);

}else{

document.getElementById("accountNo").innerText="Not Linked";

}

// Gaming Fund Counter

let balance=0;

let target=125840;

let timer=setInterval(()=>{

balance+=742;

if(balance>=target){

balance=target;

clearInterval(timer);

}

document.getElementById("gamingFund").innerHTML=
"₹ "+balance.toLocaleString("en-IN");

},20);


const names=[
"Rahul Kumar",
"Amit Singh",
"Rohit Sharma",
"Sanjay Patel",
"Vikas Gupta",
"Ankit Verma",
"Abhishek Raj",
"Deepak Yadav",
"Pawan Kumar",
"Rakesh Singh"
];

function addTransaction(){

let amount=Math.floor(Math.random()*5000)+500;

let name=names[Math.floor(Math.random()*names.length)];

let now=new Date();

let time=now.toLocaleString("en-IN");

let box=document.createElement("div");

box.style.cssText=
"background:rgba(255,255,255,.06);padding:15px;border-radius:15px;margin-bottom:12px;border-left:5px solid #00ff88;";

box.innerHTML=
"<b style='color:#00ff88;'>+ ₹"+amount.toLocaleString("en-IN")+"</b><br>"+name+"<br><small>"+time+"</small>";

let list=document.getElementById("recentCredits");

list.prepend(box);

if(list.children.length>10){

list.removeChild(list.lastChild);

}

}

for(let i=0;i<5;i++){

addTransaction();

}

setInterval(addTransaction,7000);

  </script>
