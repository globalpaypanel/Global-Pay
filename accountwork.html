<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Pay - Account Work</title>

<link rel="stylesheet" href="accountwork.css">

</head>

<body>

<div id="particles"></div>

<header class="topBar">

<div class="logo">
GLOBAL PAY
</div>

<div class="statusBadge">
🟢 ACCOUNT ACTIVE
</div>

</header>

<div class="container">

<div class="bankCard">

<div class="bankHeader">

<div class="bankIcon">
🏦
</div>

<div>

<h2 id="bankName">
Loading...
</h2>

<p id="holderName">
Loading...
</p>

</div>

</div>

<div class="bankInfo">

<div class="info">

<span>Account Number</span>

<b id="accountNo">
XXXX XXXX 0000
</b>

</div>

<div class="info">

<span>IFSC Code</span>

<b id="ifsc">
Loading...
</b>

</div>

</div>

</div>

<div class="gamingCard">

<h3>
Gaming Fund
</h3>

<h1 id="gamingFund">
₹0
</h1>

</div>

<div class="commissionCard">

<h3>
Gaming Commission (5%)
</h3>

<h1 id="commission">
₹0
</h1>

</div>

<div class="transactionTitle">

Recent Transactions

</div>

<div id="transactionList">

</div>

</div>

<div id="limitPopup" class="popup">

<div class="popupBox">

<h2>
⚠ Transaction Limit Cross
</h2>

<p>

Maximum transaction limit of

<b>₹5,00,000</b>

has been reached.

</p>

<button onclick="closePopup()">

OK

</button>

</div>

</div>

<script src="accountwork.js"></script>

</body>
</html>
