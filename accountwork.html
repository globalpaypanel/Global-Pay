<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Work</title>

<link rel="stylesheet" href="accountwork.css">

</head>
<body>

<header class="header">

<div class="logoArea">
<h1>GLOBAL PAY</h1>
<p>Professional Banking Dashboard</p>
</div>

<button id="activeBtn" class="activeBtn">
🟢 ACTIVE
</button>

</header>


<div class="bankCard">

<div class="bankLeft">

<h2 id="holderName">Loading...</h2>

<p id="bankName">Loading Bank...</p>

<p id="accountNumber">XXXX XXXX XXXX</p>

<p id="ifscCode">IFSC</p>

</div>

<div class="bankRight">

<div class="chip"></div>

<div class="bankLogo">🏦</div>

</div>

</div>


<div class="summary">

<div class="card">

<span>Gaming Fund</span>

<h2 id="gamingFund">₹0</h2>

</div>

<div class="card">

<span>Commission (5%)</span>

<h2 id="commission">₹0</h2>

</div>

</div>


<div class="transactionHeader">

<h2>Live Transactions</h2>

</div>


<div id="transactionList">

<!-- JS yaha transaction add karega -->

</div>


<div id="limitPopup" class="limitPopup">

<div class="limitBox">

<h2>⚠ ACCOUNT LIMIT CROSSED</h2>

<p>
Maximum Transaction Limit<br>
₹5,00,000 Completed
</p>

<button id="limitOk">
OK
</button>

</div>

</div>

<script src="accountwork.js"></script>

</body>
</html>
