<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Global Pay</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="profile-page">

<div class="profile-header">
<a href="home.html" class="back-btn">←</a>
<h2>My Profile</h2>
</div>

<div class="profile-card">

<div class="profile-photo">
<img id="profileImage" src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png">
</div>
  <input type="file" id="photo" accept="image/*" style="display:none" onchange="savePhoto()">

<button onclick="document.getElementById('photo').click()">
📷 Change Photo
</button>

<h2 id="profileName">User</h2>

<p>User ID : <span id="profileUserId">Inactive</span></p>

<div class="profile-info">
<p>👤 Name : <span id="profileFullName">Invalid</span></p>
<p>📱 Mobile : <span id="profileMobile">+91 XXXXXXXXXX</span></p>
<p>📧 Email : <span id="profileEmail">Not Available</span></p>
<p>💳 Wallet Balance : <span id="walletBalance">₹0.00</span></p>
<p>💵 Total Income : <span id="totalIncome">₹0.00</span></p>
</div>

<button onclick="location.href='activate.html'">Edit Profile</button>

<button onclick="location.href='activate.html?next=changepassword.html'">Change Password</button>

<button onclick="location.href='activate.html?next=bankdetails.html'">Bank / UPI Details</button>

<button onclick="location.href='support.html'">Help & Support</button>

<button onclick="location.href='index.html'" class="logout-btn">Logout</button>

</div>

</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>

<script>

const currentUser = localStorage.getItem("userid");

if (currentUser === "Kamlesh@7878") {

document.getElementById("profileName").innerText="Kamlesh";
document.getElementById("profileUserId").innerText="Kamlesh@7878";
document.getElementById("profileMobile").innerText="+91 7878562439";
document.getElementById("profileFullName").innerText="Kamlesh";
document.getElementById("profileEmail").innerText="makukamu11@gmail.com";
document.getElementById("walletBalance").innerText="₹0.00";
document.getElementById("totalIncome").innerText="₹0.00";

} else {

document.getElementById("profileName").innerText="Invalid User";
document.getElementById("profileUserId").innerText="Inactive";
document.getElementById("profileFullName").innerText="Invalid";
document.getElementById("profileMobile").innerText="+91 XXXXXXXXXX";
document.getElementById("profileEmail").innerText="Not Available";
document.getElementById("walletBalance").innerText="₹0.00";
document.getElementById("totalIncome").innerText="₹0.00";

  }
  
  function savePhoto() {
    const file = document.getElementById("photo").files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        document.getElementById("profileImage").src = e.target.result;
        localStorage.setItem("profilePhoto", e.target.result);
    };

    reader.readAsDataURL(file);
}

const photo = localStorage.getItem("profilePhoto");

if (photo) {
    document.getElementById("profileImage").src = photo;
  }
</script>
</body>
</html>
