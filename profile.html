<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Global Pay</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="profile-page">

<div class="profile-header">
<a href="home.html" class="back-btn">←</a>
<h2>My Profile</h2>
</div>

<div class="profile-card">

<div class="profile-photo">
<img id="profileImage" src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png">
</div>
  <input type="file" id="photo" accept="image/*" style="display:none" onchange="savePhoto()">

<button onclick="document.getElementById('photo').click()">
📷 Change Photo
</button>

<h2 id="profileName">User</h2>

<p>User ID : <span id="profileUserId">Inactive</span></p>

<div class="profile-info">
<p>👤 Name : <span id="profileFullName">Invalid</span></p>
<p>📱 Mobile : <span id="profileMobile">+91 XXXXXXXXXX</span></p>
<p>📧 Email : <span id="profileEmail">Not Available</span></p>
<p>💳 Wallet Balance : <span id="walletBalance">₹0.00</span></p>
<p>💵 Total Income : <span id="totalIncome">₹0.00</span></p>
</div>

<button onclick="location.href='activate.html'">Edit Profile</button>

<button onclick="location.href='activate.html?next=changepassword.html'">Change Password</button>

<button onclick="location.href='activate.html?next=bankdetails.html'">Bank / UPI Details</button>

<button onclick="location.href='support.html'">Help & Support</button>

<button onclick="location.href='index.html'" class="logout-btn">Logout</button>

</div>

</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>


<script>
firebase.auth().onAuthStateChanged(function(user) {

    if (!user) {
        location.href = "index.html";
        return;
    }

    firebase.database()
        .ref("users/" + user.uid)
        .once("value")
        .then(function(snapshot) {

            const data = snapshot.val();

            if (!data) {
                document.getElementById("profileName").innerText = "User";
                document.getElementById("profileUserId").innerText = "Inactive";
                return;
            }

            document.getElementById("profileName").innerText =
                data.fullName || "User";

            document.getElementById("profileUserId").innerText =
                data.userId || "Inactive";

            document.getElementById("profileFullName").innerText =
                data.fullName || "Not Available";

            document.getElementById("profileMobile").innerText =
                data.mobile || "+91 XXXXXXXXXX";

            document.getElementById("profileEmail").innerText =
                data.email || "Not Available";

            document.getElementById("walletBalance").innerText =
                "₹" + Number(data.walletBalance || 0).toFixed(2);

            document.getElementById("totalIncome").innerText =
                "₹" + Number(data.totalIncome || 0).toFixed(2);
        })
        .catch(function(error) {

            console.error(error);

            document.getElementById("profileName").innerText =
                "Unable to load profile";
        });
});


function savePhoto() {

    const file = document.getElementById("photo").files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        const user = firebase.auth().currentUser;

        if (!user) return;

        localStorage.setItem(
            "profilePhoto_" + user.uid,
            e.target.result
        );

        document.getElementById("profileImage").src =
            e.target.result;
    };

    reader.readAsDataURL(file);
}


firebase.auth().onAuthStateChanged(function(user) {

    if (!user) return;

    const photo =
        localStorage.getItem("profilePhoto_" + user.uid);

    if (photo) {
        document.getElementById("profileImage").src = photo;
    }
});

</script>
</body>
</html>
