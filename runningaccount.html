<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Running Account</title>

<link rel="stylesheet" href="runningaccount.css">

</head>

<body>

<div class="bg"></div>

<div class="container">

<div class="header">

<div class="logo">
GLOBAL PAY
</div>

<div class="active">
● ACTIVE
</div>

</div>

<div class="card3d">

<div class="bank" id="cardBank">
BANK NAME
</div>

<div class="chip"></div>

<div class="number" id="cardNumber">
0000 0000 0000 0000
</div>

<div class="holder" id="holderName">
Account Holder
</div>

<div class="valid">
EXPIRES

<br>

<span id="expiry"></span>

</div>

</div>

<div class="balanceCard">

<div class="balanceTitle">

Available Balance

</div>

<div class="balance">

₹ <span id="balance">0.00</span>

</div>

</div>

<div class="row">

<div class="box">

<div class="title">
Today's Income
</div>

<div class="amount">
₹0.00
</div>

</div>

<div class="box">

<div class="title">
Total Income
</div>

<div class="amount">
₹0.00
</div>

</div>

</div>

<div class="row">

<div class="box">

<div class="title">
Bank
</div>

<div class="amount" id="bankName">
ICICI
</div>

</div>

<div class="box">

<div class="title">
Phone
</div>

<div class="amount" id="phone">
+91
</div>

</div>

</div>

<div class="buttons">

<button onclick="location.href='deposit.html'">

💰 Deposit

</button>

<button onclick="location.href='withdraw.html'">

🏦 Withdraw

</button>

</div>

<div class="verified">

✔ Account Verified

<br>

✔ Mobile Verified

<br>

✔ Running Account Active

</div>

<div class="footer">

Last Updated

<br>

<span id="time"></span>

</div>

</div>

<script src="runningaccount.js"></script>

</body>

</html>
