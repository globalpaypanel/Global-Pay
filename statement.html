<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Statement Activation</title>

<link rel="stylesheet" href="statement.css">
</head>

<body>

<div class="bg"></div>

<div class="activation-card">

    <div class="lock">🔒</div>

    <h1>
        STATEMENT<br>
        ACTIVATION
    </h1>

    <p class="subtitle">
        Enter Activation Code
    </p>

    <input
        type="password"
        id="activationCode"
        placeholder="Activation Code"
        autocomplete="off"
    >

    <p id="message"></p>

    <div class="buttons">

        <button
            type="button"
            class="verify"
            id="verifyBtn">
            VERIFY
        </button>

        <button
            type="button"
            class="cancel"
            id="cancelBtn">
            CANCEL
        </button>

    </div>

</div>

<script src="statement.js"></script>

</body>
</html>
