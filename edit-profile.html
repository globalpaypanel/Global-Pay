<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GLOBAL PAY - Edit Profile</title>

<link rel="stylesheet" href="edit-profile.css">
</head>

<body>

<div class="page">

    <!-- HEADER -->

    <header>
        <button onclick="history.back()">‹</button>

        <div>
            <h1>Edit Profile</h1>
            <p>Update your personal information</p>
        </div>
    </header>


    <!-- EDIT FORM -->

    <div id="editBox" class="card">

        <h2>Personal Information</h2>

        <p class="subtitle">
            Update your account details below.
        </p>


        <label>Full Name</label>

        <input
            type="text"
            id="fullName"
            placeholder="Full Name">


        <label>User ID</label>

        <input
            type="text"
            id="userId"
            placeholder="User ID">


        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Email Address">


        <label>Mobile Number</label>

        <input
            type="tel"
            id="mobile"
            placeholder="Mobile Number">


        <label>Date of Birth</label>

        <input
            type="text"
            id="dob"
            placeholder="Date of Birth">


        <label>Address</label>

        <textarea
            id="address"
            placeholder="Address"></textarea>


        <p id="saveMessage"></p>


        <div class="buttons">

            <button
                class="cancel"
                onclick="history.back()">
                Cancel
            </button>

            <button
                class="primary"
                onclick="saveChanges()">
                ✓ Save Changes
            </button>

        </div>

    </div>

</div>


<script>

let oldUserId = "";


/* =========================
   LOAD PROFILE DATA
========================= */

function loadProfileData() {

    const currentUser =
        localStorage.getItem("userid");


    if (!currentUser) {

        window.location.href =
            "index.html";

        return;
    }


    oldUserId = currentUser;


    const savedData =
        localStorage.getItem(
            "globalPayUser_" + currentUser
        );


    if (!savedData) {

        alert("Account data not found.");

        return;
    }


    let user;

    try {

        user = JSON.parse(savedData);

    } catch (error) {

        alert("Account data is corrupted.");

        return;
    }


    /* =========================
       FILL EXISTING DETAILS
    ========================= */

    document.getElementById("fullName").value =
        user.fullName ||
        user.name ||
        "";


    document.getElementById("userId").value =
        user.userId ||
        currentUser;


    document.getElementById("email").value =
        user.email ||
        "";


    document.getElementById("mobile").value =
        user.mobile ||
        user.phone ||
        user.phoneNumber ||
        "";


    document.getElementById("dob").value =
        user.dob ||
        user.dateOfBirth ||
        "";


    document.getElementById("address").value =
        user.address ||
        "";

}


/* =========================
   SAVE CHANGES
========================= */

function saveChanges() {

    const newName =
        document.getElementById("fullName")
        .value.trim();


    const newUserId =
        document.getElementById("userId")
        .value.trim();


    const newEmail =
        document.getElementById("email")
        .value.trim();


    const newMobile =
        document.getElementById("mobile")
        .value.trim();


    const newDob =
        document.getElementById("dob")
        .value.trim();


    const newAddress =
        document.getElementById("address")
        .value.trim();


    const message =
        document.getElementById("saveMessage");


    /* =========================
       REQUIRED FIELDS
    ========================= */

    if (
        !newName ||
        !newUserId ||
        !newEmail ||
        !newMobile
    ) {

        message.style.color =
            "#ff536d";

        message.textContent =
            "Please fill all required fields.";

        return;
    }


    /* =========================
       GET OLD ACCOUNT
    ========================= */

    const oldData =
        localStorage.getItem(
            "globalPayUser_" + oldUserId
        );


    if (!oldData) {

        message.style.color =
            "#ff536d";

        message.textContent =
            "Account data not found.";

        return;
    }


    let user;

    try {

        user = JSON.parse(oldData);

    } catch (error) {

        message.style.color =
            "#ff536d";

        message.textContent =
            "Account data is corrupted.";

        return;
    }


    /* =========================
       CHECK NEW USER ID
    ========================= */

    if (newUserId !== oldUserId) {

        const existingUser =
            localStorage.getItem(
                "globalPayUser_" + newUserId
            );


        if (existingUser) {

            message.style.color =
                "#ff536d";

            message.textContent =
                "❌ This User ID is already registered.";

            return;
        }

    }


    /* =========================
       UPDATE INFORMATION
    ========================= */

    user.fullName =
        newName;

    user.userId =
        newUserId;

    user.email =
        newEmail;

    user.mobile =
        newMobile;

    user.dob =
        newDob;

    user.address =
        newAddress;


    /* =========================
       SAVE EDIT HISTORY
       Previous details remain saved
    ========================= */

    if (!user.editHistory) {

        user.editHistory = [];

    }


    user.editHistory.push({

        fullName: newName,
        userId: newUserId,
        email: newEmail,
        mobile: newMobile,
        dob: newDob,
        address: newAddress,
        editedAt: new Date().toISOString()

    });


    /* =========================
       REMOVE OLD USER ID
    ========================= */

    if (newUserId !== oldUserId) {

        localStorage.removeItem(
            "globalPayUser_" + oldUserId
        );

    }


    /* =========================
       SAVE NEW USER DATA
    ========================= */

    localStorage.setItem(

        "globalPayUser_" + newUserId,

        JSON.stringify(user)

    );


    /* =========================
       UPDATE CURRENT LOGIN ID
    ========================= */

    localStorage.setItem(
        "userid",
        newUserId
    );


    localStorage.setItem(
        "allowLoginPage",
        "true"
    );


    /* =========================
       SUCCESS MESSAGE
    ========================= */

    message.style.color =
        "#00e6a0";

    message.textContent =
        "✓ Profile updated successfully.";


    /* =========================
       GO TO PROFILE
    ========================= */

    setTimeout(function() {

        window.location.href =
            "profile.html";

    }, 1000);

}


/* =========================
   PAGE LOAD
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadProfileData();

    }
);

</script>

</body>
</html>
