<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bank Details Removed</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:#020b1c;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.popup{
    width:100%;
    max-width:360px;
    background:linear-gradient(145deg,#0b1d38,#07152b);
    border:1px solid #214773;
    border-radius:22px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.45);
    animation:popupShow .35s ease;
}

@keyframes popupShow{
    from{
        transform:scale(.85);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.success-icon{
    width:76px;
    height:76px;
    margin:0 auto 18px;
    border-radius:50%;
    background:rgba(34,197,94,.12);
    border:2px solid #22c55e;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#22c55e;
    font-size:43px;
    font-weight:bold;
}

h2{
    font-size:23px;
    margin-bottom:12px;
}

p{
    color:#aebed3;
    font-size:15px;
    line-height:1.6;
}

.redirect{
    margin-top:20px;
    color:#5da7ff;
    font-size:13px;
}
</style>

</head>

<body>

<div class="popup">

    <div class="success-icon">✓</div>

    <h2>Bank Details Removed Successfully</h2>

    <p>
        Your saved bank account details have been
        successfully removed.
    </p>

    <div class="redirect">
        Redirecting to Home...
    </div>

</div>

<script>

// Remove saved bank account details
localStorage.removeItem("bankName");
localStorage.removeItem("holderName");
localStorage.removeItem("accountNumber");
localStorage.removeItem("ifsc");
localStorage.removeItem("accountType");
localStorage.removeItem("phone");

// Redirect to Home after 2.5 seconds
setTimeout(function(){
    window.location.href = "home.html";
}, 2500);

</script>

</body>
</html>
