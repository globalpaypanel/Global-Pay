<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GLOBAL PAY - Change Password</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;
    background:
    radial-gradient(circle at 50% 10%,#122650 0%,#071329 45%,#030817 100%);
}

/* HEADER */

.header{
    height:78px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 5%;
    border-bottom:1px solid #1c3152;
    background:rgba(7,17,39,.75);
    backdrop-filter:blur(12px);
}

.back-btn{
    width:44px;
    height:44px;
    border-radius:12px;
    border:1px solid #29466f;
    background:#0c1931;
    color:#69aaff;
    font-size:30px;
    cursor:pointer;
}

.logo{
    width:43px;
    height:43px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:800;
    background:linear-gradient(135deg,#0dbaff,#3b45d8);
}

.logo-text h1{
    font-size:19px;
}

.logo-text h1 span{
    color:#099cff;
}

.logo-text p{
    color:#8f9fb9;
    font-size:10px;
    margin-top:2px;
}

/* CONTAINER */

.container{
    width:92%;
    max-width:520px;
    margin:35px auto;
}

/* CARD */

.card{
    background:linear-gradient(145deg,#101d3a,#0b152c);
    border:1px solid #243c61;
    border-radius:22px;
    padding:25px;
    box-shadow:0 20px 55px rgba(0,0,0,.35);
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.password-icon{
    width:70px;
    height:70px;
    margin:0 auto 15px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    background:#092e5d;
    border:1px solid #168eff;
    color:#55a7ff;
}

.title h2{
    font-size:24px;
}

.title p{
    color:#8fa0bb;
    font-size:13px;
    margin-top:7px;
}

/* FORM */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    color:#aebbd0;
    font-size:12px;
    margin-bottom:7px;
}

.input-box{
    position:relative;
}

.input-box input{
    width:100%;
    height:50px;
    border-radius:11px;
    border:1px solid #2b4162;
    outline:none;
    background:#09152b;
    color:#fff;
    padding:0 48px 0 14px;
    font-size:14px;
}

.input-box input:focus{
    border-color:#168eff;
    box-shadow:0 0 0 2px #168eff15;
}

.input-box input::placeholder{
    color:#596a84;
}

.eye{
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#8394ae;
    font-size:20px;
    cursor:pointer;
}

/* BUTTON */

.change-btn{
    width:100%;
    height:52px;
    margin-top:7px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#168eff,#2455df);
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.change-btn:active{
    transform:scale(.98);
}

/* MESSAGE */

.message{
    display:none;
    padding:13px;
    margin:15px 0;
    border-radius:10px;
    text-align:center;
    font-size:13px;
}

/* SECURITY */

.security{
    display:flex;
    gap:10px;
    margin-top:20px;
    padding:13px;
    border-radius:12px;
    background:#062b2d;
    border:1px solid #087263;
}

.security-icon{
    color:#00e6a0;
}

.security b{
    color:#00e6a0;
    font-size:12px;
}

.security p{
    color:#91a9ad;
    font-size:11px;
    line-height:1.5;
    margin-top:3px;
}

@media(max-width:600px){

    .container{
        width:94%;
        margin-top:25px;
    }

    .card{
        padding:20px 17px;
    }

}

</style>
</head>

<body>

<header class="header">

    <button class="back-btn" onclick="goBack()">‹</button>

    <div class="logo">
        G
    </div>

    <div class="logo-text">
        <h1>GLOBAL <span>PAY</span></h1>
        <p>Secure Payments</p>
    </div>

</header>


<main class="container">

    <div class="card">

        <div class="title">

            <div class="password-icon">
                🔐
            </div>

            <h2>Change Password</h2>

            <p>
                Create a new password for your account
            </p>

        </div>


        <!-- CURRENT PASSWORD -->

        <div class="form-group">

            <label>Current Password</label>

            <div class="input-box">

                <input
                    type="password"
                    id="currentPassword"
                    placeholder="Enter current password"
                >

                <button
                    class="eye"
                    type="button"
                    onclick="togglePassword('currentPassword',this)">
                    ◉
                </button>

            </div>

        </div>


        <!-- NEW PASSWORD -->

        <div class="form-group">

            <label>New Password</label>

            <div class="input-box">

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                >

                <button
                    class="eye"
                    type="button"
                    onclick="togglePassword('newPassword',this)">
                    ◉
                </button>

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label>Confirm New Password</label>

            <div class="input-box">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter new password"
                >

                <button
                    class="eye"
                    type="button"
                    onclick="togglePassword('confirmPassword',this)">
                    ◉
                </button>

            </div>

        </div>


        <div
            id="message"
            class="message">
        </div>


        <button
            class="change-btn"
            onclick="changePassword()">

            Change Password

        </button>


        <div class="security">

            <div class="security-icon">
                ◆
            </div>

            <div>

                <b>Password Security</b>

                <p>
                    Your new password will replace your
                    current login password.
                </p>

            </div>

        </div>

    </div>

</main>


<script>

/* =========================
   BACK
========================= */

function goBack(){

    window.location.href = "profile.html";

}


/* =========================
   MESSAGE
========================= */

function showMessage(text, success){

    const message =
        document.getElementById("message");

    message.style.display = "block";

    message.textContent = text;

    if(success){

        message.style.color = "#00e6a0";
        message.style.background = "#06352f";
        message.style.border =
            "1px solid #08765f";

    }else{

        message.style.color = "#ff6680";
        message.style.background = "#3a1028";
        message.style.border =
            "1px solid #9b3150";

    }

}


/* =========================
   CHANGE PASSWORD
========================= */

function changePassword(){

    const currentPassword =
        document.getElementById("currentPassword").value;

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    const currentUser =
        localStorage.getItem("userid");


    /* USER CHECK */

    if(!currentUser){

        window.location.href = "index.html";
        return;

    }


    /* SAVED USER DATA */

    const savedData =
        localStorage.getItem(
            "globalPayUser_" + currentUser
        );


    if(!savedData){

        showMessage(
            "User data not found.",
            false
        );

        return;

    }


    let userData;

    try{

        userData =
            JSON.parse(savedData);

    }catch(error){

        showMessage(
            "Unable to read account data.",
            false
        );

        return;

    }


    /* CURRENT PASSWORD CHECK */

    if(currentPassword !== userData.password){

        showMessage(
            "❌ Current password is incorrect.",
            false
        );

        return;

    }


    /* NEW PASSWORD CHECK */

    if(!newPassword){

        showMessage(
            "Please enter a new password.",
            false
        );

        return;

    }


    if(newPassword.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            false
        );

        return;

    }


    /* CONFIRM PASSWORD */

    if(newPassword !== confirmPassword){

        showMessage(
            "❌ New passwords do not match.",
            false
        );

        return;

    }


    /* SAME PASSWORD */

    if(currentPassword === newPassword){

        showMessage(
            "New password must be different.",
            false
        );

        return;

    }


    /* =========================
       SAVE NEW PASSWORD
    ========================= */

    userData.password = newPassword;


    localStorage.setItem(
        "globalPayUser_" + currentUser,
        JSON.stringify(userData)
    );


    showMessage(
        "✓ Password changed successfully.",
        true
    );


    /* REDIRECT TO LOGIN */

    setTimeout(function(){

        localStorage.removeItem("userid");

        window.location.href =
            "index.html";

    },1500);

}


/* =========================
   SHOW / HIDE PASSWORD
========================= */

function togglePassword(id, button){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";
        button.textContent = "◉";

    }else{

        input.type = "password";
        button.textContent = "◉";

    }

}

</script>

</body>
  </html>
