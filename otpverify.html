<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Pay - Verify Mobile</title>

<link rel="stylesheet" href="otpverify.css">
</head>

<body>

<div class="bg-glow glow-one"></div>
<div class="bg-glow glow-two"></div>
<div class="bg-glow glow-three"></div>

<main class="page">

    <section class="verify-card">

        <div class="brand">
            GLOBAL PAY
        </div>

        <div class="lock-icon">
            🔐
        </div>

        <h1>
            Verify Mobile Number
        </h1>

        <p class="subtitle">
            A verification code has been sent to your
            registered mobile number.
        </p>

        <div id="mobileNumber" class="mobile-number">
            Loading...
        </div>

        <div class="otp-container">

            <input id="otp1" maxlength="1" inputmode="numeric">
            <input id="otp2" maxlength="1" inputmode="numeric">
            <input id="otp3" maxlength="1" inputmode="numeric">
            <input id="otp4" maxlength="1" inputmode="numeric">
            <input id="otp5" maxlength="1" inputmode="numeric">
            <input id="otp6" maxlength="1" inputmode="numeric">

        </div>

        <button id="verifyBtn" class="verify-btn">
            VERIFY
        </button>

        <button id="cancelBtn" class="cancel-btn">
            CANCEL
        </button>

        <div class="progress-track">
            <div id="progressBar"></div>
        </div>

        <div class="timer">
            <strong id="seconds">45</strong>
            <span> Seconds Remaining</span>
        </div>

        <div id="status" class="status">
            Waiting for OTP...
        </div>

        <p class="warning">
            Please don't close this page while verification
            is in progress.
        </p>

        <div id="successBox" class="success-box">

            <div class="success-icon">
                ✓
            </div>

            <h2>
                Verification Successful
            </h2>

            <p>
                Mobile number verified successfully.
            </p>

        </div>

    </section>

</main>

<script src="otpverify.js"></script>

</body>
</html>
