<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GLOBAL PAY | OTP VERIFY</title>

<link rel="stylesheet" href="otpverify.css">

</head>

<body>

<div class="bgAnimation"></div>

<div class="otpContainer">

<div class="otpCard">

<div class="logo">

<h1>GLOBAL PAY</h1>

<p>Secure OTP Verification</p>

</div>

<div class="otpIcon">

📲

</div>

<h2>

VERIFY UPI

</h2>

<p class="info">

OTP has been sent successfully to your registered mobile number.

</p>

<input
type="text"
id="otpInput"
maxlength="6"
placeholder="Enter OTP">

<p id="timer">

Waiting for OTP...

</p>

<div class="buttonRow">

<button id="verifyBtn">

VERIFY

</button>

<button id="resendBtn">

RESEND OTP

</button>

</div>

<p id="statusMsg"></p>

</div>

</div>

<script src="otpverify.js"></script>

</body>

</html>
