<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdrawal Status - Global Pay</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 20% 20%,rgba(37,99,235,.18),transparent 35%),
        radial-gradient(circle at 80% 10%,rgba(124,58,237,.18),transparent 35%),
        #05070f;
    color:#fff;
}

/* Main page */

.statusCard{
    width:90%;
    max-width:420px;
    padding:30px 24px;
    text-align:center;

    background:rgba(255,255,255,.06);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.10);
    border-radius:24px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.6),
        0 0 30px rgba(255,193,7,.08);
}

.logo{
    font-size:28px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:10px;
}

.statusText{
    color:#9ca3af;
    font-size:14px;
}

/* Popup */

.balancePopup{
    display:flex;

    position:fixed;
    inset:0;

    z-index:99999;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.78);
    backdrop-filter:blur(12px);
}

.balanceBox{
    width:100%;
    max-width:380px;

    padding:30px 24px;

    border-radius:24px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #1e2a46,
            #091225
        );

    border:1px solid rgba(255,210,40,.35);

    box-shadow:
        0 20px 60px rgba(0,0,0,.7),
        0 0 35px rgba(255,193,7,.15);

    animation:popupShow .3s ease;
}

.infoIcon{
    width:62px;
    height:62px;

    margin:0 auto 15px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:30px;

    background:rgba(255,193,7,.12);

    border:1px solid rgba(255,193,7,.35);

    box-shadow:
        0 0 25px rgba(255,193,7,.2);
}

.balanceBox h2{
    color:#ffd43b;
    font-size:22px;
    margin-bottom:14px;
}

.balanceBox p{
    color:#d7deeb;
    font-size:15px;
    line-height:24px;
    margin-bottom:20px;
}

.autoBack{
    font-size:13px;
    color:#8fa4c7;
}

.autoBack b{
    color:#ffd43b;
    font-size:17px;
}

@keyframes popupShow{

    from{
        opacity:0;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}
</style>
</head>

<body>

<!-- Page behind popup -->

<div class="statusCard">

    <div class="logo">
        GLOBAL PAY
    </div>

    <div class="statusText">
        Withdrawal request status
    </div>

</div>


<!-- Popup -->

<div id="balancePopup" class="balancePopup">

    <div class="balanceBox">

        <div class="infoIcon">
            ⚠️
        </div>

        <h2>
            Balance Verification Required
        </h2>

        <p>
            Please check your available balance before
            proceeding with the withdrawal request.
        </p>

        <div class="autoBack">
            Popup will close in
            <b>
                <span id="countdown">5</span>
            </b>
            seconds...
        </div>

    </div>

</div>


<script>

const popup =
    document.getElementById("balancePopup");

const countdown =
    document.getElementById("countdown");

let seconds = 5;

countdown.innerText = seconds;


/* Countdown */

const timer = setInterval(function(){

    seconds--;

    countdown.innerText = seconds;


    if(seconds <= 0){

        clearInterval(timer);

        popup.style.display = "none";

    }

},1000);

</script>

</body>
</html>
