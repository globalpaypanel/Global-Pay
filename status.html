<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Pay - Services</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:linear-gradient(135deg,#050816,#081120,#0f172a,#050816);
background-size:400% 400%;
animation:bgMove 12s linear infinite;
color:#fff;
overflow-x:hidden;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.header{

position:sticky;
top:0;

background:rgba(8,17,32,.85);

backdrop-filter:blur(18px);

padding:20px;

text-align:center;

font-size:24px;

font-weight:bold;

letter-spacing:1px;

border-bottom:1px solid rgba(255,255,255,.08);

box-shadow:0 10px 25px rgba(0,0,0,.35);

z-index:100;

}

.container{

padding:22px;

}

.card{

position:relative;

display:flex;

justify-content:space-between;

align-items:center;

padding:20px;

margin-bottom:18px;

border-radius:24px;

cursor:pointer;

overflow:hidden;

background:linear-gradient(135deg,#132544,#1b3560,#10213d);

background-size:250% 250%;

animation:cardGradient 7s ease infinite;

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 15px 35px rgba(0,0,0,.35),
0 0 25px rgba(37,99,235,.18);

transition:.35s;

}

.card:hover{

transform:translateY(-6px) scale(1.02);

box-shadow:
0 20px 45px rgba(0,0,0,.45),
0 0 40px rgba(59,130,246,.35);

}

.card::before{

content:"";

position:absolute;

top:0;

left:-120%;

width:45%;

height:100%;

background:rgba(255,255,255,.18);

transform:skewX(-25deg);

animation:shineMove 3s linear infinite;

}

.title{

font-size:19px;

font-weight:bold;

color:#fff;

}

.arrow{

font-size:28px;

color:#FFD700;

animation:arrowMove 1.2s infinite;

}

@keyframes arrowMove{

0%,100%{transform:translateX(0);}
50%{transform:translateX(8px);}

}

@keyframes shineMove{

100%{
left:170%;
}

}

@keyframes cardGradient{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}
