<head>

<body>

<header class="header">
    <h1>🌐 GLOBAL PAY SERVICES</h1>
</header>

<div class="container">

<div class="card" onclick="showPopup()">
    <div class="title">🧪 Account Testing</div>
    <div class="arrow">›</div>
</div>

<div class="card" onclick="location.href='fund.html'">
    <div class="title">💸 Fund Change</div>
    <div class="arrow">›</div>
</div>

<div class="card" onclick="location.href='activation.html'">
    <div class="title">📲 UPI Work</div>
    <div class="arrow">›</div>
</div>

<div class="card" onclick="location.href='account-activate.html'">
    <div class="title">🏦 Account Work</div>
    <div class="arrow">›</div>
</div>

<div class="card" onclick="location.href='usdtwork.html'">
    <div class="title">🟡 USDT Work</div>
    <div class="arrow">›</div>
</div>

<div class="card" onclick="showPopup()">
    <div class="title">📄 Statement</div>
    <div class="arrow">›</div>
</div>

<div class="card" onclick="location.href='checkstatus.html'">
    <div class="title">📊 Check Status</div>
    <div class="arrow">›</div>
</div>

<div class="card" onclick="location.href='share.html'">
    <div class="title">🔗 Share Link</div>
    <div class="arrow">›</div>
</div>

<button class="back-btn" onclick="history.back()">
⬅ Back
</button>

  </div>

  <!-- ===== Activation Popup ===== -->
<div id="popup" class="popupOverlay">

  <div class="popupCard">

    <h2>Activation Required</h2>

    <p>
      Active karne ke liye account activate karein.
    </p>

    <button class="greenBtn" onclick="location.href='deposit.html'">
      Activate
    </button>

    <button class="grayBtn" onclick="closePopup()">
      Close
    </button>

  </div>

</div>

<!-- ===== Account Work Popup ===== -->
<div id="accountPopup" class="popupOverlay">

  <div class="popupCard">

    <h2>🔐 Global Pay Security</h2>

    <p>Enter Activation Code</p>

    <input
      type="password"
      id="accountCode"
      placeholder="Activation Code">

    <p id="accountError"></p>

    <button class="greenBtn" onclick="checkAccountCode()">
      VERIFY & CONTINUE
    </button>

    <button class="grayBtn" onclick="closeAccountPopup()">
      Cancel
    </button>

  </div>

</div>

<script src="status.js"></script>

</body>
</html>
