<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Chat Login</title>

<style>
body{
background:#0d1b2a;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#132238;
padding:25px;
border-radius:15px;
width:320px;
text-align:center;
color:white;
}

input{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#00b894;
border:none;
border-radius:8px;
color:white;
font-size:16px;
font-weight:bold;
}

#error{
color:red;
margin-top:10px;
}
</style>

</head>
<body>

<div class="box">

<h2>💬 Global Chat</h2>

<p>Enter Chat Code</p>

<input id="code" placeholder="Enter Code">

<button onclick="loginChat()">ENTER</button>

<p id="error"></p>

</div>

<script>
function loginChat(){

let code=document.getElementById("code").value;

if(code==="2127"){
localStorage.setItem("chatUser","Devi");
location.href="chat.html";
}

else if(code==="AJAY123"){
localStorage.setItem("chatUser","Ajay Singh");
location.href="chat.html";
}

else{
document.getElementById("error").innerHTML="Invalid Chat Code";
}

}
</script>

</body>
</html>
