<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Chat</title>

<style>
body{
margin:0;
background:#0d1b2a;
font-family:Arial,sans-serif;
color:white;
}

.header{
background:#132238;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
}

#messages{
height:70vh;
overflow-y:auto;
padding:15px;
}

.msg{
background:#1e3a5f;
padding:10px;
margin:10px 0;
border-radius:10px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
background:#132238;
padding:10px;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:8px;
font-size:16px;
}

button{
margin-left:10px;
padding:12px 20px;
border:none;
border-radius:8px;
background:#00b894;
color:white;
font-size:16px;
}
</style>
</head>

<body>

<div class="header">
💬 Global Chat
</div>

<div id="messages"></div>

<div class="bottom">
<input id="msg" placeholder="Type message...">
<button onclick="sendMessage()">Send</button>
</div>

</body>
</html>
