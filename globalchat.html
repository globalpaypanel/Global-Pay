<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Chat</title>

<style>
body{
margin:0;
background:#0d1b2a;
font-family:Arial,sans-serif;
color:white;
}

.header{
background:#132238;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
}

#messages{
height:70vh;
overflow-y:auto;
padding:15px;
}

.msg{
background:#1e3a5f;
padding:10px;
margin:10px 0;
border-radius:10px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
background:#132238;
padding:10px;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:8px;
font-size:16px;
}

button{
margin-left:10px;
padding:12px 20px;
border:none;
border-radius:8px;
background:#00b894;
color:white;
font-size:16px;
}
</style>
</head>

<body>

<div class="header">
💬 Global Chat
</div>

<div id="messages"></div>

<div class="bottom">
<input id="msg" placeholder="Type message...">
<button onclick="sendMessage()">Send</button>
</div>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYav1adnLPBJcQyFho_DG8-xZiQG5HUw0",
  authDomain: "globalchat-54294.firebaseapp.com",
  databaseURL: "https://globalchat-54294-default-rtdb.firebaseio.com",
  projectId: "globalchat-54294",
  storageBucket: "globalchat-54294.firebasestorage.app",
  messagingSenderId: "449926167987",
  appId: "1:449926167987:web:5590ccbef07cb309145fc6",
  measurementId: "G-TZG1T534ZC"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.sendMessage = function () {
  const text = document.getElementById("msg").value;
  if (!text) return;

  const currentUser = localStorage.getItem("userid");

push(ref(db, "chat"), {
    user: currentUser,
    text: text,
    time: Date.now()
});

  document.getElementById("msg").value = "";
};

onChildAdded(ref(db, "chat"), (snapshot) => {
  const data = snapshot.val();

  document.getElementById("messages").innerHTML += `
<div class="msg">
<b>${data.user}</b><br>
${data.text}
</div>`;

  document.getElementById("messages").scrollTop =
    document.getElementById("messages").scrollHeight;
});
  </script>
</body>
</html>
