<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GLOBAL PAY | UPI SETUP</title>

<link rel="stylesheet" href="upisetup.css">

</head>

<body>

<div class="bgAnimation"></div>

<div class="setupContainer">

<div class="setupCard">

<div class="logo">

<h1>GLOBAL PAY</h1>

<p>Secure UPI Setup</p>

</div>

<h2>

UPI ACCOUNT SETUP

</h2>

<p class="subTitle">

Complete your UPI details to continue.

</p>

<div class="inputBox">

<label>Holder Name</label>

<input
type="text"
id="holderName"
placeholder="Enter Holder Name">

</div>

<div class="inputBox">

<label>Bank Name</label>

<input
type="text"
id="bankName"
placeholder="Enter Bank Name">

</div>

<div class="inputBox">

<label>Mobile Number</label>

<input
type="tel"
id="mobileNumber"
maxlength="10"
placeholder="10 Digit Mobile Number">

</div>

<div class="inputBox">

<label>UPI ID</label>

<input
type="text"
id="upiId"
placeholder="Example : 739XXXXX86@ybl">

</div>

<button id="continueBtn">

CONTINUE →

</button>

<p id="errorMsg"></p>

</div>

</div>

<script src="upisetup.js"></script>

</body>
</html>
