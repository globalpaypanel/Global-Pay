<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Mobile</title>

<link rel="stylesheet" href="otp.css">

</head>

<body>

<div class="main">

<h1>Verify your mobile number</h1>

<p class="desc">
This verifies your identity and helps you securely log in.
</p>


<div class="phone" id="phoneNumber">
OTP sent to +91
</div>

<div class="otpArea">

<input id="d1" maxlength="1" autocomplete="one-time-code">
<input id="d2" maxlength="1">
<input id="d3" maxlength="1">
<input id="d4" maxlength="1">
<input id="d5" maxlength="1">
<input id="d6" maxlength="1">

</div>

<div class="timer">

<span id="countDown">
Auto-reading OTP 00:60
</span>

</div>

<div id="recaptcha-container"></div>

<button id="verifyBtn">

Verify OTP

</button>

<div class="resend">

Unable to receive OTP?

<a href="#" id="resendBtn">

Resend OTP

</a>

</div>

</div>

<script type="module" src="otp.js"></script>

<script>
const phone = localStorage.getItem("phone");

if(phone){
    document.getElementById("phoneNumber").innerHTML =
    "OTP sent to +91 " + phone;
}
</script>
