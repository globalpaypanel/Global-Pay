<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>OTP Verification</title>

<link rel="stylesheet" href="otp.css">

</head>

<body>

<div class="bgGlow"></div>

<div class="card">

<div class="logo">
GLOBAL PAY
</div>

<h1>
Verify Mobile Number
</h1>

<p class="sub">
A secure verification code has been sent to your registered mobile number.
</p>

<div class="mobile" id="mobile">
+91 **********
</div>

<div class="otpArea">

<input id="o1" readonly>
<input id="o2" readonly>
<input id="o3" readonly>
<input id="o4" readonly>
<input id="o5" readonly>
<input id="o6" readonly>

</div>

<div class="loading">

<div class="line">

<div id="progress"></div>

</div>

</div>

<div class="timer">

<span id="time">

30

</span>

Seconds Remaining

</div>

<div class="status" id="status">

Waiting for secure OTP...

</div>

<div class="footer">

Please don't close this page while verification is in progress.

</div>

</div>

<script src="otp.js"></script>

</body>

</html>
