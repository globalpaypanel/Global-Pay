<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Mobile Number</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:420px;
}

h1{
font-size:42px;
font-weight:bold;
margin-bottom:12px;
}

.desc{
font-size:19px;
color:#bdbdbd;
line-height:1.5;
margin-bottom:40px;
}

.number{
font-size:30px;
font-weight:bold;
margin-bottom:25px;
}

.otp-box{
display:flex;
justify-content:space-between;
margin-bottom:30px;
}

.otp-box input{
width:58px;
height:72px;
background:#121212;
border:2px solid #3a3a3a;
border-radius:12px;
color:#fff;
font-size:32px;
text-align:center;
outline:none;
}

.otp-box input:focus{
border-color:#8b5cf6;
}

.auto{
color:#9ca3af;
font-size:18px;
margin-bottom:35px;
}

.bottom{
position:fixed;
left:0;
right:0;
bottom:35px;
text-align:center;
}

.bottom a{
color:#9d6bff;
font-size:20px;
text-decoration:none;
font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>Verify your mobile number</h1>

<p class="desc">
This verifies your identity and helps you securely log in.
</p>

<div class="number" id="mobileNumber">
OTP sent to +91 **********
</div>

<div class="otp-box">
<input maxlength="1" id="o1">
<input maxlength="1" id="o2">
<input maxlength="1" id="o3">
<input maxlength="1" id="o4">
<input maxlength="1" id="o5">
<input maxlength="1" id="o6">
</div>

<div class="auto">
Auto-reading OTP...
</div>

</div>

<div class="bottom">
<a href="#">Unable to receive OTP?</a>
</div>

<script>

// Phone number show
let phone=localStorage.getItem("phone");

if(phone){
document.getElementById("mobileNumber").innerHTML=
"OTP sent to +91 "+phone;
}

// Auto move
const inputs=document.querySelectorAll(".otp-box input");

inputs.forEach((input,index)=>{

input.addEventListener("input",()=>{

if(input.value.length==1 && index<inputs.length-1){
inputs[index+1].focus();
}

let otp="";

inputs.forEach(i=>otp+=i.value);

if(otp.length==6){

setTimeout(()=>{

window.location.href="runningaccount.html";

},400);

}

});

});

</script>

</body>
</html>
