<html lang="en">
<head>

<link rel="stylesheet" href="otp.css">

</head>

<body>

<div class="main">

</p>

+91
</div>

<div class="otpBoxes">

<input id="b4" readonly>

</div>

30
</span>

</div>

</div>

</div>
