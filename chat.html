<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Chat</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #0d1b2a;
  color: white;
}

.header {
  background: #132238;
  padding: 18px;
  font-size: 25px;
  font-weight: bold;
}

#connection {
  padding: 5px 12px;
  font-size: 12px;
  color: #a8f5c8;
  background: #132238;
}

#error {
  color: #ffaaaa;
  padding: 8px 12px;
  overflow-wrap: anywhere;
}

#messages {
  height: calc(100dvh - 175px);
  overflow-y: auto;
  padding: 12px;
}

.msg {
  max-width: 82%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

.myMsg {
  background: #008f72;
  margin-left: auto;
}

.otherMsg {
  background: #1e3a5f;
  margin-right: auto;
}

.username {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 6px;
  color: #d4ffeb;
}

.messageText {
  white-space: pre-wrap;
}

.time {
  font-size: 10px;
  text-align: right;
  margin-top: 6px;
  color: #e0e0e0;
}

#typingStatus {
  min-height: 22px;
  padding: 3px 12px;
  font-size: 12px;
  color: #00ff99;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #132238;
}

#msg {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: none;
  border-radius: 28px;
  background: white;
  color: black;
  font-size: 16px;
  outline: none;
}

#sendBtn {
  border: none;
  padding: 0 22px;
  border-radius: 28px;
  background: #00b894;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

#sendBtn:disabled {
  opacity: 0.6;
}

@media (min-width: 700px) {
  #messages {
    max-width: 850px;
    margin: auto;
  }

  .bottom {
    justify-content: center;
  }

  #msg {
    max-width: 700px;
    flex: none;
    width: 70%;
  }
}
</style>
</head>

<body>

<div class="header">💬 Global Chat</div>

<div id="connection">Connecting to Firebase...</div>
<div id="error"></div>

<div id="messages"></div>
<div id="typingStatus"></div>

<div class="bottom">
  <input
    id="msg"
    type="text"
    placeholder="Type a message..."
    autocomplete="off"
    maxlength="2000"
  >
  <button id="sendBtn">Send</button>
</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onChildAdded,
  onChildChanged,
  onValue,
  onDisconnect,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyAYav1adnLPBJcQyFho_DG8-xZiQG5HUw0",
  authDomain: "globalchat-54294.firebaseapp.com",
  databaseURL: "https://globalchat-54294-default-rtdb.firebaseio.com",
  projectId: "globalchat-54294",
  storageBucket: "globalchat-54294.firebasestorage.app",
  messagingSenderId: "449926167987",
  appId: "1:449926167987:web:5590ccbef07cb309145fc6"
};


/* ELEMENTS */

const messagesBox = document.getElementById("messages");
const input = document.getElementById("msg");
const sendBtn = document.getElementById("sendBtn");
const errorBox = document.getElementById("error");
const connectionBox = document.getElementById("connection");
const typingStatus = document.getElementById("typingStatus");


/* CURRENT CHAT USER */

const currentUser = localStorage.getItem("chatUser");

if (!currentUser) {
  document.body.innerHTML = `
    <div style="padding:25px;color:white">
      <h2>Global Chat</h2>
      <p>Please login first.</p>
      <button onclick="location.href='globalchat.html'">
        Go to Login
      </button>
    </div>
  `;
  throw new Error("Chat user not found");
}


/* INITIALIZE FIREBASE */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);


/* DATABASE REFERENCES */

const chatRef = ref(db, "globalChat");

const myTypingRef = ref(
  db,
  "typing/" + encodeURIComponent(currentUser)
);

let sending = false;
let typingTimer;


/* ERROR DISPLAY */

function showError(message) {
  errorBox.textContent = message;
}


/* MESSAGE RENDERING */

function displayMessage(id, data) {
  if (!data) return;

  let messageBox = document.getElementById("message-" + id);

  if (!messageBox) {
    messageBox = document.createElement("div");
    messageBox.id = "message-" + id;
    messagesBox.appendChild(messageBox);
  }

  const isMine = data.user === currentUser;

  messageBox.className = "msg " +
    (isMine ? "myMsg" : "otherMsg");

  messageBox.replaceChildren();

  const username = document.createElement("div");
  username.className = "username";
  username.textContent = isMine ? "You" : (data.user || "User");

  const messageText = document.createElement("div");
  messageText.className = "messageText";
  messageText.textContent = data.text || "";

  const time = document.createElement("div");
  time.className = "time";

  let timeText = "";

  if (data.time) {
    const date = new Date(data.time);

    if (!isNaN(date.getTime())) {
      timeText = date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }
  }

  if (isMine) {
    timeText += data.seen ? " ✓✓" : " ✓";
  }

  time.textContent = timeText;

  messageBox.append(username, messageText, time);

  messagesBox.scrollTop = messagesBox.scrollHeight;
}


/* FIREBASE CONNECTION STATUS */

onValue(
  ref(db, ".info/connected"),
  snapshot => {
    connectionBox.textContent = snapshot.val()
      ? "🟢 Connected"
      : "🔴 Reconnecting...";
  },
  error => {
    connectionBox.textContent = "Connection error";
    showError(error.message);
  }
);


/* LOGIN AND CHAT START */

async function startChat() {
  try {
    connectionBox.textContent = "Signing in...";

    await signInAnonymously(auth);

    connectionBox.textContent = "🟢 Logged in";

    /* Receive messages */

    onChildAdded(
      chatRef,
      snapshot => {
        displayMessage(snapshot.key, snapshot.val());
      },
      error => {
        showError("Read error: " + error.message);
      }
    );

    onChildChanged(
      chatRef,
      snapshot => {
        displayMessage(snapshot.key, snapshot.val());
      },
      error => {
        showError("Update error: " + error.message);
      }
    );

    /* Typing indicator */

    onValue(
      ref(db, "typing"),
      snapshot => {
        const users = snapshot.val() || {};
        const now = Date.now();

        const activeUsers = Object.values(users).filter(user => {
          return user &&
            user.user !== currentUser &&
            user.typing === true &&
            now - (user.time || 0) < 6000;
        });

        typingStatus.textContent = activeUsers.length
          ? activeUsers.map(user => user.user + " is typing...").join(", ")
          : "";
      },
      error => {
        console.error("Typing error:", error);
      }
    );

    /* Clear typing status when disconnected */

    onDisconnect(myTypingRef).remove().catch(console.error);

  } catch (error) {
    console.error("Firebase login error:", error);

    connectionBox.textContent = "Login failed";

    showError(
      "Firebase login error: " +
      error.code + " - " + error.message
    );
  }
}


/* SEND MESSAGE */

async function sendMessage() {
  const text = input.value.trim();

  if (!text || sending || !auth.currentUser) {
    return;
  }

  sending = true;
  sendBtn.disabled = true;
  errorBox.textContent = "";

  try {
    const newMessageRef = push(chatRef);

    await set(newMessageRef, {
      user: currentUser,
      uid: auth.currentUser.uid,
      text: text,
      time: Date.now(),
      seen: false
    });

    input.value = "";

    await set(myTypingRef, {
      user: currentUser,
      typing: false,
      time: Date.now()
    });

  } catch (error) {
    console.error("Send error:", error);

    showError(
      "Message send nahi hua: " +
      error.code + " - " + error.message
    );

  } finally {
    sending = false;
    sendBtn.disabled = false;
    input.focus();
  }
}


sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
});


/* TYPING STATUS */

input.addEventListener("input", () => {
  clearTimeout(typingTimer);

  const typing = input.value.trim().length > 0;

  set(myTypingRef, {
    user: currentUser,
    typing: typing,
    time: Date.now()
  }).catch(error => {
    console.error("Typing status error:", error);
  });

  if (typing) {
    typingTimer = setTimeout(() => {
      set(myTypingRef, {
        user: currentUser,
        typing: false,
        time: Date.now()
      }).catch(console.error);
    }, 2500);
  }
});


/* START */

startChat();

</script>

</body>
</html>
