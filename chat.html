<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Chat</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #0d1b2a;
  color: white;
}

.header {
  background: #132238;
  padding: 18px;
  font-size: 22px;
  font-weight: bold;
}

#messages {
  height: calc(100dvh - 145px);
  overflow-y: auto;
  padding: 12px;
}

.msg {
  max-width: 80%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

.myMsg {
  background: #00a884;
  margin-left: auto;
}

.otherMsg {
  background: #1e3a5f;
  margin-right: auto;
}

.user {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 5px;
}

.time {
  font-size: 10px;
  text-align: right;
  margin-top: 5px;
}

#typingStatus {
  color: #00ff99;
  padding: 5px 12px;
  font-size: 12px;
}

.bottom {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #132238;
}

#msg {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: none;
  border-radius: 25px;
  background: white;
  color: black;
  font-size: 16px;
}

#sendBtn {
  border: none;
  padding: 12px 18px;
  border-radius: 25px;
  background: #00b894;
  color: white;
  font-weight: bold;
}

#error {
  color: #ffaaaa;
  padding: 5px 12px;
}
</style>
</head>

<body>

<div class="header">💬 Global Chat</div>

<div id="error"></div>
<div id="messages"></div>
<div id="typingStatus"></div>

<div class="bottom">
  <input id="msg" type="text" placeholder="Type message..." autocomplete="off">
  <button id="sendBtn">Send</button>
</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onChildAdded,
  onChildChanged,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYav1adnLPBJcQyFho_DG8-xZiQG5HUw0",
  authDomain: "globalchat-54294.firebaseapp.com",
  databaseURL: "https://globalchat-54294-default-rtdb.firebaseio.com",
  projectId: "globalchat-54294",
  storageBucket: "globalchat-54294.firebasestorage.app",
  messagingSenderId: "449926167987",
  appId: "1:449926167987:web:5590ccbef07cb309145fc6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const currentUser = localStorage.getItem("chatUser");

if (!currentUser) {
  location.href = "globalchat.html";
  throw new Error("Login required");
}

const messages = document.getElementById("messages");
const input = document.getElementById("msg");
const sendBtn = document.getElementById("sendBtn");
const typingStatus = document.getElementById("typingStatus");

const chatRef = ref(db, "globalChat");
const myTypingRef = ref(
  db,
  "typing/" + encodeURIComponent(currentUser)
);

function showError(message) {
  document.getElementById("error").textContent = message;
}

function displayMessage(id, data) {
  if (!data) return;

  let box = document.getElementById("message-" + id);

  if (!box) {
    box = document.createElement("div");
    box.id = "message-" + id;
    messages.appendChild(box);
  }

  box.className =
    "msg " + (data.user === currentUser ? "myMsg" : "otherMsg");

  box.replaceChildren();

  const user = document.createElement("div");
  user.className = "user";
  user.textContent = data.user || "User";

  const text = document.createElement("div");
  text.textContent = data.text || "";

  const time = document.createElement("div");
  time.className = "time";
  time.textContent =
    new Date(data.time || Date.now()).toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    }) +
    (data.user === currentUser
      ? (data.seen ? " ✓✓" : " ✓")
      : "");

  box.append(user, text, time);

  messages.scrollTop = messages.scrollHeight;
}

onChildAdded(chatRef, snapshot => {
  displayMessage(snapshot.key, snapshot.val());

  const data = snapshot.val();

  if (data && data.user !== currentUser && !data.seen) {
    set(ref(db, "globalChat/" + snapshot.key + "/seen"), true)
      .catch(console.error);
  }
});

onChildChanged(chatRef, snapshot => {
  displayMessage(snapshot.key, snapshot.val());
});

/* Send message */
let sending = false;

async function sendMessage() {
  const text = input.value.trim();

  if (!text || sending) return;

  sending = true;
  sendBtn.disabled = true;

  try {
    const newMessage = push(chatRef);

    await set(newMessage, {
      user: currentUser,
      text: text,
      time: Date.now(),
      seen: false
    });

    input.value = "";
    await set(myTypingRef, {
      user: currentUser,
      typing: false,
      time: Date.now()
    });
  } catch (error) {
    console.error(error);
    showError("Message send nahi hua. Firebase Rules check karein.");
  } finally {
    sending = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
});

/* Typing indicator */
let typingTimer;

input.addEventListener("input", () => {
  clearTimeout(typingTimer);

  const isTyping = input.value.trim().length > 0;

  set(myTypingRef, {
    user: currentUser,
    typing: isTyping,
    time: Date.now()
  }).catch(console.error);

  if (isTyping) {
    typingTimer = setTimeout(() => {
      set(myTypingRef, {
        user: currentUser,
        typing: false,
        time: Date.now()
      }).catch(console.error);
    }, 2500);
  }
});

onValue(ref(db, "typing"), snapshot => {
  const users = snapshot.val() || {};
  const now = Date.now();

  const activeUsers = Object.values(users).filter(user =>
    user &&
    user.user !== currentUser &&
    user.typing === true &&
    now - (user.time || 0) < 6000
  );

  typingStatus.textContent = activeUsers.length
    ? activeUsers.map(user => user.user + " is typing...").join(", ")
    : "";
});
</script>

</body>
</html>
