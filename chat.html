<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Chat</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d1b2a;
display:flex;
flex-direction:column;
height:100vh;
overflow:hidden;
}

.header{
height:60px;
background:#132238;
color:#fff;
display:flex;
align-items:center;
padding:0 15px;
font-size:22px;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.header a{
color:#fff;
text-decoration:none;
margin-right:15px;
font-size:24px;
}

#messages{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
max-width:75%;
padding:10px 14px;
border-radius:16px;
word-break:break-word;
position:relative;
animation:fade .2s ease;
}

.myMsg{
background:#00b894;
color:#fff;
margin-left:auto;
border-bottom-right-radius:5px;
}

.otherMsg{
background:#1e3a5f;
color:#fff;
margin-right:auto;
border-bottom-left-radius:5px;
}

.user{
font-size:13px;
font-weight:bold;
margin-bottom:4px;
}

.time{
font-size:11px;
opacity:.8;
margin-top:6px;
text-align:right;
}

.menu{
position:absolute;
top:5px;
right:8px;
font-size:18px;
cursor:pointer;
}

#typingStatus{
height:24px;
padding-left:15px;
font-size:13px;
color:#00ff99;
font-style:italic;
}

.bottom{
display:flex;
padding:10px;
background:#132238;
gap:10px;
}

.bottom input{
flex:1;
padding:12px;
border:none;
outline:none;
border-radius:25px;
font-size:16px;
}

.bottom button{
border:none;
padding:12px 18px;
border-radius:25px;
background:#00b894;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.miniMenu{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#1b263b;
border-radius:14px;
overflow:hidden;
min-width:190px;
box-shadow:0 10px 35px rgba(0,0,0,.45);
z-index:9999;
}

.miniMenu div{
padding:14px;
text-align:center;
cursor:pointer;
color:#fff;
border-bottom:1px solid rgba(255,255,255,.08);
}

.miniMenu div:last-child{
border-bottom:none;
}

.miniMenu div:hover{
background:#2c3e50;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
  }
</style>
</head>

<body>

<div class="header">
<a href="home.html">←</a>
💬 Global Chat
</div>

<div id="messages"></div>

<div id="typingStatus"></div>

<div class="bottom">
<input id="msg" placeholder="Type message...">
<button id="sendBtn">Send</button>
</div>

<div id="miniMenu" class="miniMenu">
<div onclick="popupCopy()">📋 Copy</div>
<div onclick="popupDelete()">🗑 Delete</div>
<div onclick="closePopup()">❌ Cancel</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, push, set, remove, update, onChildAdded, onChildRemoved, onValue } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
  const firebaseConfig = {
  apiKey: "AIzaSyAYav1adnLPBJcQyFho_DG8-xZiQG5HUw0",
  authDomain: "globalchat-54294.firebaseapp.com",
  databaseURL: "https://globalchat-54294-default-rtdb.firebaseio.com",
  projectId: "globalchat-54294",
  storageBucket: "globalchat-54294.firebasestorage.app",
  messagingSenderId: "449926167987",
  appId: "1:449926167987:web:5590ccbef07cb309145fc6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const currentUser = localStorage.getItem("chatUser");

const typingRef = ref(db, "typing");

document.getElementById("msg").addEventListener("input", () => {

const text = document.getElementById("msg").value;
set(typingRef,{
user:"",
typing:false
});

if(text.length > 0){

set(typingRef,{
user:currentUser,
typing:true
});

}else{

set(typingRef,{
user:"",
typing:false
});

}

});

document.getElementById("sendBtn").onclick = function () {

  const text = document.getElementById("msg").value.trim();

  if (text === "") return;

const msgRef = push(ref(db, "globalChat"));

set(msgRef, {
  user: currentUser,
  text: text,
  time: Date.now(),
  seen: false
});

set(typingRef,{
  user:"",
  typing:false
});
  
  document.getElementById("msg").value = "";
};

onChildAdded(ref(db, "globalChat"), (snapshot) => {

  const data = snapshot.val();

  if(data.user !== currentUser && data.seen === false){

update(ref(db,"globalChat/"+snapshot.key),{
seen:true
});

  }

  let cls =
    data.user === currentUser ? "myMsg" : "otherMsg";

  const msgTime = new Date(data.time).toLocaleTimeString([], {
  hour: "2-digit",
  minute: "2-digit"
});

document.getElementById("messages").innerHTML += `
<div class="msg ${cls}" id="msg_${snapshot.key}">
<div class="menu" onclick="openMenu('${snapshot.key}','${data.user}',event)">⋮</div>
<b>${data.user}</b><br>
${data.text}
<div class="time">
${msgTime}

${data.user===currentUser ?
(data.seen ? " ✓✓" : " ✓")
: ""}

</div>

</div>
`;

  document.getElementById("messages").scrollTop =
    document.getElementById("messages").scrollHeight;

const msgBox = document.getElementById("msg_" + snapshot.key);

if (data.user === currentUser) {

  msgBox.ondblclick = function () {

    if (confirm("Delete this message?")) {
      deleteMessage(snapshot.key);
    }

  };

  }
  
});

onChildRemoved(ref(db, "globalChat"), (snapshot) => {

  const msg = document.getElementById("msg_" + snapshot.key);

  if(msg){
    msg.remove();
  }

});

window.deleteMessage = function(id){

    if(confirm("Delete this message?")){

        remove(ref(db,"globalChat/"+id));

    }

}

let selectedMsgId = "";
let selectedMsgText = "";

window.openMenu = function(id,user,event){

if(user!==currentUser) return;

selectedMsgId = id;

selectedMsgText =
document.getElementById("msg_"+id).innerText;

const menu = document.getElementById("miniMenu");

menu.style.display = "block";
  }

  window.popupDelete = function(){

closePopup();

deleteMessage(selectedMsgId);

}

window.popupCopy = function(){

navigator.clipboard.writeText(selectedMsgText);

closePopup();

alert("Message Copied");

}

window.closePopup = function(){

document.getElementById("miniMenu").style.display = "none";

  }

  window.onclick = function(e){

const menu = document.getElementById("miniMenu");

if(e.target.id !== "miniMenu" &&
   !e.target.classList.contains("menu")){

menu.style.display = "none";

}

   }
onValue(typingRef,(snapshot)=>{

const data = snapshot.val();

const typingBox = document.getElementById("typingStatus");

if(!data){
typingBox.innerHTML="";
return;
}

if(data.user !== currentUser && data.typing){

typingBox.innerHTML = "🟢 " + data.user + " is typing...";

}else{

typingBox.innerHTML = "";

}

});

  
</script>

</body>
</html>
