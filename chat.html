<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Chat</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d1b2a;
}

.header{
background:#132238;
color:white;
padding:15px;
display:flex;
align-items:center;
font-size:20px;
font-weight:bold;
}

.header a{
color:white;
text-decoration:none;
margin-right:15px;
font-size:22px;
}

#messages{
height:calc(100vh - 130px);
overflow-y:auto;
padding:15px;
}

.msg{
padding:10px 14px;
border-radius:12px;
margin:8px 0;
max-width:75%;
word-wrap:break-word;
-webkit-user-select: none;
user-select: none;
}

.myMsg{
background:#00b894;
color:#fff;
margin-left:auto;
text-align:right;
}

.otherMsg{
background:#1e3a5f;
color:#fff;
margin-right:auto;
text-align:left;
}

.time{
font-size:11px;
opacity:0.7;
margin-top:5px;
}


.menu{
float:right;
font-size:22px;
cursor:pointer;
padding:2px 6px;
color:white;
}


.bottom{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
padding:10px;
background:#132238;
}

.bottom input{
flex:1;
padding:12px;
border:none;
border-radius:8px;
font-size:16px;
}

.bottom button{
margin-left:10px;
padding:12px 20px;
border:none;
border-radius:8px;
background:#00b894;
color:white;
font-weight:bold;
cursor:pointer;
}

.miniMenu{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#1b263b;
border-radius:12px;
overflow:hidden;
box-shadow:0 8px 25px rgba(0,0,0,.45);
z-index:9999;
min-width:180px;
}

.miniMenu div{
padding:14px;
text-align:center;
color:#fff;
cursor:pointer;
border-bottom:1px solid rgba(255,255,255,.1);
font-size:16px;
}

.miniMenu div:last-child{
border-bottom:none;
}

.miniMenu div:hover{
background:#2c3e50;
}
</style>
</head>

<body>

<div class="header">
<a href="home.html">←</a>
💬 Global Chat
</div>

<div id="messages"></div>

<div class="bottom">
<input id="msg" placeholder="Type message...">
<button id="sendBtn">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, push, set, remove, update, onChildAdded, onChildRemoved } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
  const firebaseConfig = {
  apiKey: "AIzaSyAYav1adnLPBJcQyFho_DG8-xZiQG5HUw0",
  authDomain: "globalchat-54294.firebaseapp.com",
  databaseURL: "https://globalchat-54294-default-rtdb.firebaseio.com",
  projectId: "globalchat-54294",
  storageBucket: "globalchat-54294.firebasestorage.app",
  messagingSenderId: "449926167987",
  appId: "1:449926167987:web:5590ccbef07cb309145fc6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const currentUser = localStorage.getItem("chatUser");

document.getElementById("sendBtn").onclick = function () {

  const text = document.getElementById("msg").value.trim();

  if (text === "") return;

const msgRef = push(ref(db, "globalChat"));

set(msgRef, {
  user: currentUser,
  text: text,
  time: Date.now(),
  seen: false
});
  
  document.getElementById("msg").value = "";
};

onChildAdded(ref(db, "globalChat"), (snapshot) => {

  const data = snapshot.val();

  if(data.user !== currentUser && data.seen === false){

update(ref(db,"globalChat/"+snapshot.key),{
seen:true
});

  }

  let cls =
    data.user === currentUser ? "myMsg" : "otherMsg";

  const msgTime = new Date(data.time).toLocaleTimeString([], {
  hour: "2-digit",
  minute: "2-digit"
});

document.getElementById("messages").innerHTML += `
<div class="msg ${cls}" id="msg_${snapshot.key}">
<div class="menu" onclick="openMenu('${snapshot.key}','${data.user}',event)">⋮</div>
<b>${data.user}</b><br>
${data.text}
<div class="time">
${msgTime}

${data.user===currentUser ?
(data.seen ? " ✓✓" : " ✓")
: ""}

</div>

</div>
`;

  document.getElementById("messages").scrollTop =
    document.getElementById("messages").scrollHeight;

const msgBox = document.getElementById("msg_" + snapshot.key);

if (data.user === currentUser) {

  msgBox.ondblclick = function () {

    if (confirm("Delete this message?")) {
      deleteMessage(snapshot.key);
    }

  };

  }
  
});

onChildRemoved(ref(db, "globalChat"), (snapshot) => {

  const msg = document.getElementById("msg_" + snapshot.key);

  if(msg){
    msg.remove();
  }

});

window.deleteMessage = function(id){

    if(confirm("Delete this message?")){

        remove(ref(db,"globalChat/"+id));

    }

}

let selectedMsgId = "";
let selectedMsgText = "";

window.openMenu = function(id,user,event){

if(user!==currentUser) return;

selectedMsgId = id;

selectedMsgText =
document.getElementById("msg_"+id).innerText;

const menu = document.getElementById("miniMenu");

menu.style.display = "block";
  }

  window.popupDelete = function(){

closePopup();

deleteMessage(selectedMsgId);

}

window.popupCopy = function(){

navigator.clipboard.writeText(selectedMsgText);

closePopup();

alert("Message Copied");

}

window.closePopup = function(){

document.getElementById("miniMenu").style.display = "none";

  }

  window.onclick = function(e){

const menu = document.getElementById("miniMenu");

if(e.target.id !== "miniMenu" &&
   !e.target.classList.contains("menu")){

menu.style.display = "none";

}

   }
  
</script>

<div id="miniMenu" class="miniMenu">
  <div onclick="popupCopy()">📋 Copy</div>
  <div onclick="popupDelete()">🗑 Delete</div>
</div>

</body>
</html>
