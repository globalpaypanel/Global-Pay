<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit Balance</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#020b1c;
    color:white;
}

.page{
    min-height:100vh;
    max-width:720px;
    margin:auto;
    background:linear-gradient(180deg,#031127,#06152c);
}

/* Header */
.header{
    height:90px;
    padding:18px 22px;
    display:flex;
    align-items:center;
    gap:15px;
    border-bottom:1px solid #17355c;
}

.back-btn{
    width:52px;
    height:52px;
    border-radius:15px;
    border:1px solid #1d4777;
    background:#071a35;
    color:white;
    font-size:30px;
}

.logo{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#0878ff,#1649db);
    font-size:30px;
    font-weight:bold;
}

.brand h1{
    font-size:24px;
}

.brand p{
    color:#91a5c2;
    font-size:13px;
    margin-top:4px;
}

/* Content */
.content{
    padding:30px 20px;
}

h2{
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    color:#91a5c2;
    margin-bottom:25px;
}

/* Balance Card */
.balance-card{
    padding:30px 22px;
    border-radius:24px;
    background:linear-gradient(135deg,#087c91,#1245bd,#30158c);
    border:1px solid #2588ff;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.label{
    color:#d7e5f5;
    font-size:17px;
    margin-bottom:12px;
}

.balance{
    font-size:48px;
    font-weight:800;
}

.status{
    margin-top:20px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 15px;
    border:1px solid #20d99d;
    border-radius:25px;
    color:#27dda5;
    font-size:14px;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#27dda5;
}

</style>
</head>

<body>

<div class="page">

    <header class="header">

        <button
            class="back-btn"
            onclick="window.location.href='deposit.html'">
            ‹
        </button>

        <div class="logo">
            G
        </div>

        <div class="brand">
            <h1>
                GLOBAL
                <span style="color:#2389ff;">PAY</span>
            </h1>

            <p>Secure Payments</p>
        </div>

    </header>


    <main class="content">

        <h2>Deposit Balance</h2>

        <p class="subtitle">
            Your current deposit balance
        </p>


        <div class="balance-card">

            <div class="label">
                Deposit Balance
            </div>

            <div class="balance">
                ₹0.00
            </div>

            <div class="status">
                <span class="dot"></span>
                Current Balance
            </div>

        </div>

    </main>

</div>

</body>
</html>
